<!doctype html><meta charset="utf-8" /><title>栅图 MapCanvas</title
><style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font: 13px system-ui;
  }
  nav {
    padding: 4px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  main {
    flex: 1;
    min-height: 150px;
    position: relative;
    overflow: hidden;
    background: #999;
  }
  canvas {
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ring {
    position: absolute;
    pointer-events: none;
    border: 1px solid white;
    outline: 1px solid black;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  [hidden] {
    display: none !important;
  }
  [aria-pressed="true"] {
    background: #bde0ff;
  }
  #list {
    max-height: 100px;
    overflow: auto;
  }
  #list button {
    display: block;
  }
  body {
    color-scheme: light dark;
    background: #f7f8fa;
    color: #1d2939;
  }
  nav {
    padding: 8px 12px;
    border-bottom: 1px solid #8893a633;
    gap: 6px;
  }
  button,
  input,
  select {
    font: inherit;
    border: 1px solid #8d99ae66;
    border-radius: 6px;
    padding: 6px 9px;
    background: transparent;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid #5085e5;
    outline-offset: 2px;
  }
  input[type="checkbox"] {
    accent-color: #5085e5;
  }
  #meta,
  #status {
    padding: 7px 12px;
    font-size: 12px;
  }
  #status {
    min-height: 18px;
    border-top: 1px solid #8893a633;
  }
  #ai-guide {
    white-space: pre-wrap;
    max-height: 180px;
    overflow: auto;
    margin: 0;
    padding: 10px 12px;
    border-bottom: 1px solid #8893a633;
  }
  #list:empty {
    display: none;
  }
  #list {
    padding: 0 12px;
  }
  main {
    background: #252c36;
  }
  #yaml,
  #img {
    flex: 1;
    min-width: 130px;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #171b22;
      color: #e6eaf0;
    }
  }
  @media (max-width: 600px) {
    nav {
      padding: 6px;
    }
    #meta {
      font-size: 11px;
    }
  }
</style>
<nav>
  <b>栅图 MapCanvas 0.2.0</b
  ><select id="source">
    <option value="workspace">工作目录</option></select
  ><button id="refresh">刷新来源</button
  ><label><input id="local" type="checkbox" />本机文件</label
  ><input id="pick" type="file" multiple accept=".yaml,.yml,.pgm,.png" /><label
    ><input id="discard" type="checkbox" />允许丢弃</label
  ><button id="load">导入</button
  ><button id="ai-help" aria-controls="ai-guide" aria-expanded="false">
    AI工具指南
  </button>
</nav>
<nav>
  <input id="dir" value="." /><button id="browse">浏览</button
  ><button id="up">上级</button
  ><button id="paths-toggle" aria-controls="list" aria-expanded="false">
    显示路径</button
  ><input id="yaml" placeholder="YAML路径" /><input
    id="img"
    placeholder="图片留空自动找"
  />
</nav>
<div id="list" hidden aria-label="地图路径列表"></div>
<nav>
  <button id="wall" title="画墙" aria-label="画墙">🖌</button
  ><button id="erase" title="擦墙" aria-label="擦墙">▱</button
  ><button id="gray" title="灰色画笔：未知区域" aria-label="灰色画笔">◩</button
  ><button id="pan" title="平移" aria-label="平移">✋</button
  ><label
    >直径<input
      id="brush"
      type="number"
      min="1"
      max="200"
      value="5"
      style="width: 50px"
    />px</label
  ><button id="undo">撤销</button><button id="redo">重做</button
  ><button id="minus">−</button><button id="plus">＋</button
  ><button id="fit">适应</button><button id="actual">1:1</button
  ><button id="direct" title="保存原图" aria-label="保存原图">💾</button
  ><button id="abort" hidden>取消待保存</button
  ><input id="name" value="map_edited" /><button id="export">导出ZIP</button>
</nav>
<pre id="ai-guide" hidden aria-label="AI工具指南"></pre>
<div id="meta">滚轮缩放；空格/中键平移。</div>
<main>
  <canvas id="cv"></canvas>
  <div id="ring" hidden></div>
</main>
<div id="status">等待连接</div>

        w(h, 22, b.length);

        w(c, 8, 2048, 2);
        w(c, 14, 33, 2);

  })();
