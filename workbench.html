<script>
  /* MAPCANVAS_CORE_BEGIN */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.MapCanvasCore = factory();
})(globalThis, () => {
  "use strict";
  const E = (message) => {
      throw Error(message);
    },
    T = new TextEncoder();
  function yaml(text) {
    const l = text.replace(/^\uFEFF/, "").split(/\r\n|\r|\n/),
      v = Object.create(null),
      rows = l
        .map((s, i) => ({
          i,
          m: /^( *)([\w-]+|"[\w-]+"|'[\w-]+')\s*:(.*)$/.exec(s),
        }))
        .filter((r) => r.m);
    if (
      !rows.length ||
      l.filter((s) => s.trim() === "---").length > 1 ||
      l.some((s) => /^ *\t/.test(s))
    )
      E("不支持的YAML结构");
    const base = Math.min(...rows.map((r) => r.m[1].length));
    let idx = -1;
    for (const { i, m } of rows) {
      if (m[1].length !== base) continue;
      const k = m[2].replace(/^['"]|['"]$/g, "");
      if (Object.hasOwn(v, k)) E("YAML第" + (i + 1) + "行重复键 " + k);
      let s = m[3].replace(/\s+#.*$/, "").trim();
      if (k === "origin") {
        if (!s) {
          const a = [];
          for (let j = i + 1; j < l.length; j++) {
            const n = l[j].replace(/\s+#.*$/, "").trim();
            if (!n || n[0] === "#") continue;
            const q = /^-\s+(.+)$/.exec(n);
            if (!q) break;
            a.push(q[1]);
          }
          s = "[" + a.join(",") + "]";
        } else
          for (
            let j = i + 1;
            s[0] === "[" && !s.includes("]") && j < l.length;
            j++
          )
            s += " " + l[j].replace(/\s+#.*$/, "").trim();
      }
      if (s[0] === '"') s = JSON.parse(s);
      else if (s[0] === "'") {
        if (!/^'(?:[^']|'')*'$/.test(s)) E("YAML引号错误");
        s = s.slice(1, -1).replace(/''/g, "'");
      }
      v[k] = s;
      if (k === "image") idx = i;
    }
    const num = (s) =>
        /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(s) &&
        Number.isFinite(+s),
      r = +v.resolution,
      n = +(v.negate ?? 0),
      f = +v.free_thresh,
      o = +v.occupied_thresh;
    if (
      !num(v.resolution) ||
      !num(v.free_thresh) ||
      !num(v.occupied_thresh) ||
      !num(v.negate ?? "0") ||
      r <= 0 ||
      ![0, 1].includes(n) ||
      f < 0 ||
      f >= o ||
      o > 1 ||
      !v.image ||
      /[\x00-\x1f]/.test(v.image) ||
      (v.mode && v.mode !== "trinary")
    )
      E("地图参数错误");
    if (!/^\[[^\[\]]*\]$/.test(v.origin || "")) E("origin格式错误");
    const a = v.origin
      .slice(1, -1)
      .split(",")
      .map((s) => s.trim());
    if (a.at(-1) === "") a.pop();
    if (a.length !== 3 || !a.every(num)) E("origin需三个数字");
    return { l, idx, image: v.image, r, n, f, o, a };
  }
  function path(base, s) {
    if (
      s.startsWith("/") ||
      /^[A-Za-z][A-Za-z0-9+.-]*:/.test(s) ||
      /[\\\x00-\x1f]/.test(s)
    )
      E("请手动指定图片");
    const a = base.split("/").slice(0, -1);
    for (const p of s.split("/"))
      if (p === "..") {
        if (!a.length) E("image越界");
        a.pop();
      } else if (p && p !== ".") a.push(p);
    return a.join("/");
  }
  function pgm(b) {
    let p = 0;
    const ws = (c) => [9, 10, 11, 12, 13, 32].includes(c),
      skip = () => {
        while (p < b.length) {
          if (ws(b[p])) p++;
          else if (b[p] === 35) {
            while (p < b.length && ![10, 13].includes(b[p])) p++;
          } else break;
        }
      },
      tok = () => {
        skip();
        let s = "";
        while (p < b.length && !ws(b[p]) && b[p] !== 35) {
          s += String.fromCharCode(b[p++]);
          if (s.length > 64) E("PGM错误");
        }
        return s;
      },
      num = () => {
        const s = tok();
        if (!/^\d+$/.test(s)) E("PGM数字错误");
        return +s;
      };
    const t = tok(),
      w = num(),
      h = num(),
      max = num(),
      n = w * h;
    if (
      !["P2", "P5"].includes(t) ||
      !w ||
      !h ||
      w > 16384 ||
      h > 16384 ||
      n > 4194304 ||
      max < 1 ||
      max > 65535
    )
      E("PGM尺寸/格式错误");
    const data = new Uint16Array(n);
    if (t === "P5") {
      if (!ws(b[p])) E("PGM分隔错误");
      if (b[p++] === 13 && b[p] === 10) p++;
      if (b.length - p !== n * (max > 255 ? 2 : 1)) E("PGM长度错误");
      for (let i = 0; i < n; i++)
        data[i] = max > 255 ? b[p++] * 256 + b[p++] : b[p++];
    } else {
      for (let i = 0; i < n; i++) {
        const value = num();
        if (value > max) E("像素超限");
        data[i] = value;
      }
      skip();
      if (p !== b.length) E("PGM多余数据");
    }
    if (data.some((v) => v > max)) E("像素超限");
    return { w, h, max, data };
  }
  function encodePGM(M) {
    const h = T.encode("P5\n" + M.w + " " + M.h + "\n" + M.max + "\n"),
      b = new Uint8Array(h.length + M.data.length * (M.max > 255 ? 2 : 1));
    b.set(h);
    let p = h.length;
    for (const v of M.data) {
      if (M.max > 255) b[p++] = v >> 8;
      b[p++] = v & 255;
    }
    return b;
  }

  function isUnknown(value, a, max) {
    const p = a.n ? value / max : 1 - value / max;

    C.onlostpointercapture = (e) => end(e, true);
    C.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        h = pt(e);
        zoom(
          Math.exp(-Math.max(-300, Math.min(300, e.deltaY)) * 0.003),
          h.x,
          h.y,
        );
      },
      { passive: false },
    );
    function travel(a, b) {
      if (!M || busy || pending || closed || d || !a.length) return;
      b.push(M.data);
      M.data = a.pop();
      trim();
      dirty = true;
      raster();
      lock();
    }
    for (const k of ["wall", "erase", "gray", "pan"])
      $(k).onclick = () => {
        if (!d) {
          t = k;
          lock();
        }
      };
    $("undo").onclick = () => travel(U, R);
    $("redo").onclick = () => travel(R, U);
    $("minus").onclick = () => zoom(1 / 1.3);
    $("plus").onclick = () => zoom(1.3);
    $("fit").onclick = fit;
    $("actual").onclick = () => zoom(1 / z);
    $("brush").oninput = cursor;
    window.onkeydown = (e) => {
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.code === "Space") {
        e.preventDefault();
        sp = true;
        cursor();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        travel(e.shiftKey ? R : U, e.shiftKey ? U : R);
      }
    };
    window.onkeyup = (e) => {
      if (e.code === "Space") {
        sp = false;
        cursor();
      }
    };
    window.onblur = () => {
      sp = false;
      h = null;
      if (d) end({ pointerId: d.id }, true);
      cursor();
    };
    function pgmOut() {
      return MapCanvasCore.encodePGM(M);
    }
    async function imageOut() {
      if (/\.pgm$/i.test(target.path)) return pgmOut();
      const b = await new Promise((resolve, reject) =>
        O.toBlob(
          (v) => (v ? resolve(v) : reject(Error("PNG编码失败"))),
          "image/png",
        ),
      );
      return new Uint8Array(await b.arrayBuffer());
    }
    $("direct").onclick = () =>
      run(async () => {
        if (d || pending || !target) E("请结束笔画；本机文件请导出ZIP");
        const r = await bind();
        if (!r.editable) E("来源只读，请导出ZIP另存");
        const b = await imageOut();
        await request("document.save.begin", { size: b.length, version });
        pending = true;
        lock();
        for (let offset = 0; offset < b.length; offset += 524288) {
          let s = "";
          const p = b.subarray(offset, offset + 524288);
          for (let i = 0; i < p.length; i += 8192)
            s += String.fromCharCode(...p.subarray(i, i + 8192));
          await request("document.save.chunk", { offset, data: btoa(s) });
        }
        await request("document.save.request");
        N("请点击宿主上方“保存到原文件”；尚未落盘");
      });
    $("abort").onclick = () =>
      run(async () => {
        await request("document.save.abort");
        pending = false;
        announced = undefined;
        N("已取消草稿，画布编辑保留");
      });
    function zip(fs) {
      const out = [],
        cent = [];
      let pos = 0,
        size = 0;
      const w = (b, p, v, n = 4) =>
        new DataView(b.buffer)[n === 2 ? "setUint16" : "setUint32"](p, v, true);
      for (const [name, b] of fs) {
        let crc = -1;
        for (const v of b) {
          crc ^= v;
          for (let i = 0; i < 8; i++)
            crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
        }
        crc = (crc ^ -1) >>> 0;
        const n = T.encode(name),
          h = new Uint8Array(30 + n.length),
          c = new Uint8Array(46 + n.length);
        w(h, 0, 0x04034b50);
        w(h, 4, 20, 2);
        w(h, 6, 2048, 2);
        w(h, 12, 33, 2);
        w(h, 14, crc);
        w(h, 18, b.length);
        w(h, 22, b.length);
        w(h, 26, n.length, 2);
        h.set(n, 30);
        out.push(h, b);
        w(c, 0, 0x02014b50);
        w(c, 4, 20, 2);
        w(c, 6, 20, 2);
        w(c, 8, 2048, 2);
        w(c, 14, 33, 2);
        w(c, 16, crc);
        w(c, 20, b.length);
        w(c, 24, b.length);
        w(c, 28, n.length, 2);
        w(c, 42, pos);
        c.set(n, 46);
        cent.push(c);
        pos += h.length + b.length;
        size += c.length;
      }
      const e = new Uint8Array(22);
      w(e, 0, 0x06054b50);
      w(e, 8, fs.length, 2);
      w(e, 10, fs.length, 2);
      w(e, 12, size);
      w(e, 16, pos);
      const b = new Uint8Array(pos + size + 22);
      let p = 0;
      for (const v of [...out, ...cent, e]) {
        b.set(v, p);
        p += v.length;
      }
      return b;
    }
    $("export").onclick = () =>
      run(async () => {
        if (d || pending) E("请结束笔画并处理草稿");
        const n = $("name").value.trim();
        if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/.test(n))
          E("名称需字母数字下划线连字符");
        const l = A.l.slice();
        l[A.idx] =
          (l[A.idx].match(/^\s*/) || [""])[0] +
          "image: " +
          JSON.stringify(n + ".pgm");
        const bytes = zip([
          [n + ".yaml", T.encode(l.join("\n").replace(/\n*$/, "\n"))],
          [n + ".pgm", pgmOut()],
        ]).buffer;
        exp = "export_" + ++seq;
        parent.postMessage(
          {
            type: "aide.workbench.export",
            protocol: 1,
            pluginId: "mapcanvas",
            requestId: exp,
            name: n + ".zip",
            bytes,
          },
          "*",
          [bytes],
        );
        N("ZIP已生成，等待宿主保存入口；未确认落盘");
      });
    function showPaths(show) {
      $("list").hidden = !show;
      $("paths-toggle").textContent = show ? "隐藏路径" : "显示路径";
      $("paths-toggle").setAttribute("aria-expanded", String(show));
      $("paths-toggle").title = show ? "隐藏路径" : "显示路径";
      if (M) draw();
    }
    $("paths-toggle").onclick = () => showPaths($("list").hidden);
    function browse(path) {
      return run(async () => {
        const r = await call("mapcanvas_browse", args({ path }));
        $("dir").value = r.path;
        $("list").replaceChildren();
        for (const e of r.entries || []) {
          const b = document.createElement("button");
          b.textContent = (e.kind === "directory" ? "▸ " : "") + e.path;
          b.onclick = () => {
            if (e.kind === "directory") browse(e.path);
            else if (/\.ya?ml$/i.test(e.path)) {
              $("yaml").value = e.path;
              $("img").value = "";
            } else $("img").value = e.path;
          };
          $("list").append(b);
        }
        showPaths(true);
        N("点击目录进入，点击文件选择；可用隐藏路径收起列表");
      });
    }
    $("browse").onclick = () => browse($("dir").value);
    $("up").onclick = () => {
      const p = $("dir").value;
      browse(p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : ".");
    };
    $("yaml").onchange = () => ($("img").value = "");
    window.addEventListener("message", (e) => {
      if (e.source !== parent) return;
      const m = e.data;
      if (m?.type === "aide.workbench.theme" && m.protocol === 1 && ["light", "dark"].includes(m.theme)) {
        document.documentElement.dataset.theme = m.theme;
        const keys = { bg: "bg", panel: "panel", surface: "surface", field: "field", text: "text", muted: "muted", line: "line", selected: "selected" };
        for (const [key, token] of Object.entries(keys)) {
          const color = m.colors?.[key];
          if (typeof color === "string" && color.length <= 80 && !/[;{}]/.test(color) && CSS.supports("color", color))
            document.documentElement.style.setProperty("--" + token, color);
        }
        return;
      }
      if (
        m?.type === "aide.workbench.connect" &&
        !port &&
        !closed &&
        m.protocol === 1 &&
        m.pluginId === "mapcanvas" &&
        e.ports?.length === 1
      ) {
        clearTimeout(timer);
        port = e.ports[0];
        port.onmessage = (e) => {
          const r = e.data;
          if (r?.event === "scope.revoked") {
            stop("授权已变化，请重开；未自动保存");
            return;
          }
          if (r?.event === "document.saved" && r.result?.saved) {
            version = r.result.version;
            pending = false;
            dirty = false;
            announced = undefined;
            N("原图片已保存，YAML未改动");
            lock();
            return;
          }
          if (r?.event || !req || r.requestId !== req.id) return;
          const p = req;
          req = null;
          clearTimeout(p.timer);
          if (r.status === "result") p.resolve(r.result);
          else p.reject(Error(r.error || "调用失败"));
        };
        port.start();
        run(sources);
      } else if (
        m?.type === "aide.workbench.export.status" &&
        m.protocol === 1 &&
        m.requestId === exp
      )
        N(
          m.status === "error"
            ? "导出失败：" + m.error
            : "宿主保存入口已显示；请保存并核对下载结果",
        );
    });
    const timer = setTimeout(() => stop("连接超时，请重开"), 12000);
    window.addEventListener("pagehide", () => {
      clearTimeout(timer);
      obs.disconnect();
      stop("已关闭");
    });
    lock();
    parent.postMessage({ type: "aide.workbench.theme.ready", protocol: 1 }, "*");
    parent.postMessage(
      { type: "aide.workbench.ready", protocol: 1, requestIds: "monotonic" },
      "*",
    );
  })();
</script>
